name: Release

on:
  push:
    branches: [main]
  # Publishes a package Release Please already tagged, when its publish job
  # never ran (for example, runners were unavailable and the run can no longer
  # be retried).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. cli-v0.0.26"
        required: true

permissions:
  contents: read

env:
  MYNTH_WORKOS_CLIENT_ID: ${{ vars.MYNTH_WORKOS_CLIENT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Main
    runs-on: ubuntu-latest
    # Skip verification on release-please commits (version bumps, changelog updates)
    if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')"
    permissions:
      contents: read
      id-token: write # Codecov upload over OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs pnpm from packageManager, Node from devEngines.runtime,
      # and runs `pnpm install` itself.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      # Coverage from `main` is the baseline pull requests are compared against,
      # and what the README badges show.
      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        uses: ./.github/actions/upload-coverage

      - name: Build
        run: pnpm run build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    # Release Please release commits intentionally skip `verify`.
    # `always()` keeps this job runnable after a skipped dependency so tags,
    # releases, and publish fan-out still happen on merged release PRs.
    if: ${{ github.event_name == 'push' && always() && !failure() && !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: release
    # always() is required to work around GitHub Actions' transitive skip
    # propagation (actions/runner#2205): when `verify` is skipped on release
    # commits, descendants inherit that skip unless they opt out with always().
    if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.paths_released != '[]' && needs.release.outputs.paths_released != '' }}
    environment: npm
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release.outputs.paths_released) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Release Please only bumps each package's own version, which pnpm-lock.yaml
      # does not record, so the frozen install still matches on release commits.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          cache: true

      # Trusted publishing (OIDC) needs npm >= 11.5.1, which ships with Node 24.
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Turbo builds workspace dependencies first (the adapter needs the SDK).
      - name: Build
        run: pnpm exec turbo run build --filter=./${{ matrix.path }}

      # `pnpm pack` replaces `workspace:` ranges with real versions; npm then
      # publishes that tarball with provenance through trusted publishing.
      - name: Publish package to npm
        run: |
          pnpm --dir ${{ matrix.path }} pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

  republish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve package
        id: package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            sdk-v*) echo "path=packages/sdk" >> "$GITHUB_OUTPUT" ;;
            cli-v*) echo "path=packages/cli" >> "$GITHUB_OUTPUT" ;;
            tan-ai-v*) echo "path=packages/tanstack-ai-adapter" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown release tag: $TAG" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build
        run: pnpm exec turbo run build --filter=./${{ steps.package.outputs.path }}

      - name: Publish package to npm
        run: |
          pnpm --dir ${{ steps.package.outputs.path }} pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public
